name: Android packages

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ike-android-packages-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 27.2.12479018

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pinned Android NDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root=${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            sdkmanager=$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -print -quit)
          fi
          test -n "$sdkmanager" -a -x "$sdkmanager"
          "$sdkmanager" "ndk;${NDK_VERSION}" >/dev/null
          test -d "$sdk_root/ndk/${NDK_VERSION}"
          printf 'ANDROID_SDK_ROOT=%s\nANDROID_HOME=%s\n' "$sdk_root" "$sdk_root" >> "$GITHUB_ENV"

      - name: Cross-compile exact phone and tablet packages
        shell: bash
        run: |
          set -euo pipefail

          source_sha=$(git rev-parse HEAD)
          expected_source_sha='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$source_sha" = "$expected_source_sha"

          ndk="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          toolchain="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p dist

          package_target() {
            local target=$1
            local abi=$2
            local compiler=$3
            local machine_pattern=$4
            local archive=$5
            local stage="dist/stage-$target"

            rm -rf "$stage"
            mkdir -p "$stage/bin" "$stage/share/ike"

            "$toolchain/$compiler" \
              -std=c11 -Wall -Wextra -Wpedantic -O2 -fPIE -pie \
              ike.c -o "$stage/bin/ike"
            "$toolchain/llvm-strip" "$stage/bin/ike"

            header=$($toolchain/llvm-readelf -h "$stage/bin/ike")
            printf '%s\n' "$header"
            printf '%s\n' "$header" | grep -E "Machine:.*$machine_pattern" >/dev/null
            printf '%s\n' "$header" | grep -E 'Type:.*DYN' >/dev/null

            printf '%s\n' "$source_sha" > "$stage/share/ike/source-commit"
            printf '%s\n' "$target" > "$stage/share/ike/package-target"
            printf '%s\n' "$abi" > "$stage/share/ike/package-abi"
            printf '%s\n' "$NDK_VERSION" > "$stage/share/ike/ndk-version"

            (
              cd "$stage"
              sha256sum \
                bin/ike \
                share/ike/source-commit \
                share/ike/package-target \
                share/ike/package-abi \
                share/ike/ndk-version \
                > share/ike/manifest.sha256
            )

            tar -C "$stage" -czf "dist/$archive" .
            sha256sum "dist/$archive" > "dist/$archive.sha256"
          }

          package_target \
            phone armeabi-v7a armv7a-linux-androideabi21-clang 'ARM' \
            ike-phone-armeabi-v7a.tar.gz
          package_target \
            tablet arm64-v8a aarch64-linux-android21-clang 'AArch64' \
            ike-tablet-arm64-v8a.tar.gz

          cat dist/*.sha256

      - name: Upload package evidence
        uses: actions/upload-artifact@v4
        with:
          name: ike-android-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/ike-phone-armeabi-v7a.tar.gz
            dist/ike-phone-armeabi-v7a.tar.gz.sha256
            dist/ike-tablet-arm64-v8a.tar.gz
            dist/ike-tablet-arm64-v8a.tar.gz.sha256
          if-no-files-found: error

      - name: Publish exact-main packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          test "$source_sha" = "$GITHUB_SHA"
          short=${source_sha:0:12}
          tag="ike-android-$short"
          assets=(
            dist/ike-phone-armeabi-v7a.tar.gz
            dist/ike-phone-armeabi-v7a.tar.gz.sha256
            dist/ike-tablet-arm64-v8a.tar.gz
            dist/ike-tablet-arm64-v8a.tar.gz.sha256
          )

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$source_sha" \
              --prerelease \
              --title "Ike Android packages $short" \
              --notes "NDK-cross-compiled Ike packages for exact source commit $source_sha. This proves build/package/publication only; emulator and physical phone/tablet execution remain separate evidence."
          fi
