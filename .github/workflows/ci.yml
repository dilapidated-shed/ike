name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap Ike
        run: cc -std=c11 -Wall -Wextra -Wpedantic -O2 ike.c -o ike
      - name: Check forced self-rebuild
        run: |
          sleep 1
          touch ike.c
          test "$(./ike)" = "cc -std=c11 -Wall -Wextra -Wpedantic -O2 ike.c -o ike"
          test -z "$(./ike)"
      - name: Run behavior checks through Ike
        run: ./ike test
