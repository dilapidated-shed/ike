name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap Ike
        run: cc -std=c11 -Wall -Wextra -Wpedantic -O2 ike.c -o ike
      - name: Check self-hosting Ikefile
        run: ./ike
      - name: Run behavior checks through Ike
        run: ./ike test
