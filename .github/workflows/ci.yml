name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: isomorphisms/ai-ci/ick-host@f538ed81669ceb2d521b65fc3b3af7c2e51dd2f2
        id: ick
      - name: Bootstrap Ike
        env:
          ICK: ${{ steps.ick.outputs.compiler }}
        run: '"$ICK" -fno-link-libatomic -std=c11 -Wall -Wextra -Wpedantic -O2 ike.c -o ike'
      - name: Check forced self-rebuild
        env:
          ICK: ${{ steps.ick.outputs.compiler }}
        run: |
          sleep 1
          touch ike.c
          test "$(./ike)" = '"$ICK" -fno-link-libatomic -std=c11 -Wall -Wextra -Wpedantic -O2 ike.c -o ike'
          test -z "$(./ike)"
      - name: Run behavior checks through Ike
        env:
          ICK: ${{ steps.ick.outputs.compiler }}
        run: ./ike test
      - name: Check out the pinned converted-source guard
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/ai-ci
          ref: f538ed81669ceb2d521b65fc3b3af7c2e51dd2f2
          path: _/ci/ai-ci
          persist-credentials: false
      - name: Enforce assignment arrows in converted C
        run: make -f _/ci/ai-ci/c-source/Makefile check ICK="${{ steps.ick.outputs.compiler }}" ICK_LINK_FLAGS="${{ steps.ick.outputs.link_flags }}" FILES="ike.c _/tests/parser_equivalence.c tests/aici-fixture/verifier.c"
      - name: Verify the exact-head qualification contract
        run: |
          "${{ steps.ick.outputs.compiler }}" ${{ steps.ick.outputs.link_flags }} -std=c17 -O2 -Wall -Wextra -Werror _/ci/ai-ci/src/aici.c -o "$RUNNER_TEMP/aici-icky"
          "$RUNNER_TEMP/aici-icky" suite _/ci/suite.tsv .
