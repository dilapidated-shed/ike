name: Make compatibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  differential:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Ike
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare GNU Make with mock Ike
        run: |
          make --version
          sh test
